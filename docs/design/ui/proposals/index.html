<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notekeeper</title>
  <link rel="stylesheet" href="base.css">
  <script>
    // load the stylesheet of the chosen direction before first paint
    const d = new URLSearchParams(location.search).get('d');
    const dir = ['paper', 'quiet', 'ink'].includes(d) ? d : 'paper';
    document.write(`<link rel="stylesheet" href="${dir}.css">`);
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
