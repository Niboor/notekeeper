version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: dbq
        out: internal/store/dbq
        sql_package: pgx/v5
        emit_interface: false
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: {import: github.com/google/uuid, type: UUID}
          - db_type: uuid
            nullable: true
            go_type: {import: github.com/google/uuid, type: NullUUID}
          - db_type: timestamptz
            go_type: {import: time, type: Time}
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
          - db_type: text
            nullable: true
            go_type: {type: string, pointer: true}
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: {type: int32, pointer: true}
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type: {type: int64, pointer: true}
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type: {type: bool, pointer: true}
