openapi: 3.0.3
info:
  title: Notekeeper user API
  version: 1.0.0
  description: |
    API used by the web app (and later the Android client). Session cookies for the web,
    bearer tokens for native clients. See docs/design/02-api.md.

    Every operation declares its callers with `security`: `[]` means anonymous; `sessionAuth` or
    `bearerAuth` means any signed-in user; the scope `admin` additionally requires the admin.
    The authorisation matrix test (core/internal/server) is generated from these declarations
    and fails for an operation that has none (SEC-ISO-1).
servers:
  - url: /
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information
      security: []
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}

  # ---- authentication ---------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with username and password; sets the session cookies
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Renew the session tokens (called silently by clients)
      description: The refresh token comes from its cookie (web) or the request body (native clients).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '204': {description: Signed out}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/activate:
    post:
      operationId: activate
      summary: Set a password from an activation link and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateRequest'}
      responses:
        '200':
          description: Activated and signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        default: {$ref: '#/components/responses/Problem'}

  # ---- account ----------------------------------------------------------------------------
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in user's profile
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMe
      summary: Change display name, time zone or notice settings
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMe'}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: Change the password; keeps this session and signs out the others
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Changed}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/sessions:
    get:
      operationId: listSessions
      summary: Active sessions of the user
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out one session
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: Sign out everywhere
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keep_current: {type: boolean, default: false}
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Problem'}

  # ---- chat identities --------------------------------------------------------------------
  /api/v1/me/identities:
    get:
      operationId: listIdentities
      summary: Linked chat identities
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Identities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Identity'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/identities/{id}:
    delete:
      operationId: unlinkIdentity
      summary: Unlink a chat identity
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Unlinked}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/pairing-codes:
    post:
      operationId: createPairingCode
      summary: Create a one-time code to link a chat with `!link CODE`
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bot_instance_id]
              properties:
                bot_instance_id: {type: string, format: uuid}
      responses:
        '201':
          description: Created; the code is shown only now
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCode'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/bot-instances:
    get:
      operationId: listBotInstances
      summary: Bot instances the user can link to, with their online status
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/BotInstanceSummary'}
        default: {$ref: '#/components/responses/Problem'}

  # ---- notes ------------------------------------------------------------------------------
  /api/v1/inbox/notes:
    get:
      operationId: listInbox
      summary: The Inbox, newest first
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of notes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotePage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}:
    get:
      operationId: getNote
      summary: One note with its parts
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteNotePermanently
      summary: Permanently delete a note that is in the Trash
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}

  # ---- pages, categories, board ------------------------------------------------------------
  /api/v1/pages:
    get:
      operationId: listPages
      summary: The user's pages in order
      security: &user
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Pages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createPage
      summary: Create a page
      security: *user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePage'}
      responses:
        '201':
          description: Created (or the existing page for a repeated client id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/pages/{id}:
    patch:
      operationId: updatePage
      summary: Rename, reorder or archive a page
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePage'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deletePage
      summary: Delete a page; its notes return to the Inbox
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deleted'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/pages/{id}/board:
    get:
      operationId: getBoard
      summary: A page's categories with their first notes and counts, in one call
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - name: notes_per_category
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Board'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/categories:
    post:
      operationId: createCategory
      summary: Create a category on a page
      security: *user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCategory'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Rename a category, reorder it, or move it to another page
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCategory'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteCategory
      summary: Delete a category; its notes return to the Inbox
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deleted'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/categories/{id}/notes:
    get:
      operationId: listCategoryNotes
      summary: Notes of a category in their manual order
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of notes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotePage'}
        default: {$ref: '#/components/responses/Problem'}

  # ---- note operations -----------------------------------------------------------------------
  /api/v1/notes:
    post:
      operationId: createNote
      summary: Create a note in the app, in the Inbox or in a category
      security: *user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNote'}
      responses:
        '201':
          description: Created (or the existing note for a repeated client id with the same content)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}/move:
    post:
      operationId: moveNote
      summary: Move a note to a category (at a position) or back to the Inbox
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveNote'}
      responses:
        '200':
          description: The moved note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}/dismiss:
    post:
      operationId: dismissNote
      summary: Dismiss a note (soft delete); undo with restore
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: The dismissed note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}/restore:
    post:
      operationId: restoreNote
      summary: Restore a dismissed note to where it was (or the Inbox)
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: The restored note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}/parts:
    post:
      operationId: addNotePart
      summary: Add a text or attachment part to a note
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPart'}
      responses:
        '201':
          description: The updated note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}/parts/{partId}:
    patch:
      operationId: editNotePart
      summary: Edit the text of a part (the latest edit wins; nothing is lost)
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/PartId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditPart'}
      responses:
        '200':
          description: The updated note; stale says another edit happened since base_version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EditResult'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteNotePart
      summary: Remove a part (a note always keeps at least one)
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/PartId'}
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notes/{id}/history:
    get:
      operationId: getNoteHistory
      summary: Every text version of every part of a note
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: History, newest first per part
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteHistory'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/trash/notes:
    get:
      operationId: listTrash
      summary: Dismissed notes, newest first
      security: *user
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of dismissed notes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotePage'}
        default: {$ref: '#/components/responses/Problem'}

  # ---- attachments -----------------------------------------------------------------------------
  /api/v1/attachments/{id}:
    put:
      operationId: uploadAttachment
      summary: Upload a file (raw body, streamed); idempotent on the id
      description: |
        The body is the file itself with `Content-Type: application/octet-stream`; `Content-Length`
        is required. The name goes in `X-Filename` (percent-encoded), the media type in `X-Media-Type`.
        The attachment is unlinked until a note part references it; unused ones are removed after an hour.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - name: X-Filename
          in: header
          required: true
          schema: {type: string, maxLength: 1024}
        - name: X-Media-Type
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttachmentRef'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: downloadAttachment
      summary: Download a file; supports Range and conditional requests
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: The file. Always sent with nosniff, a sandbox CSP and `private, no-cache`.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/search:
    get:
      operationId: searchNotes
      summary: Full-text search over the user's notes
      description: |
        Matches note text and attachment filenames, ignoring case and accents, with prefix matching
        for the last words typed. Results are ranked; `snippet` marks matches with the private-use
        characters U+E000 (start) and U+E001 (end), which the client turns into highlights.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: scope
          in: query
          schema: {type: string, enum: [active, trash, all], default: active}
        - name: page_id
          in: query
          schema: {type: string, format: uuid}
        - name: category_id
          in: query
          schema: {type: string, format: uuid}
        - name: has_attachment
          in: query
          schema: {type: boolean}
        - name: has_reminder
          in: query
          schema: {type: boolean}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchPage'}
        default: {$ref: '#/components/responses/Problem'}

  # ---- realtime and sync ------------------------------------------------------------------
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Server-Sent Events stream of change notifications
      description: |
        Hand-written handler (not generated). `event: change` with `id: <seq>` per change,
        `event: resync` when the client must refetch, `event: reconnect` before a server shutdown;
        a comment line every 25 seconds. Resumes from `Last-Event-ID`.
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/changes:
    get:
      operationId: listChanges
      summary: The change feed after a cursor
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
          description: Opaque cursor from an earlier response; omit for the current position
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangePage'}
        '410':
          description: The cursor is older than the retained changes; refetch everything
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ---- administration ---------------------------------------------------------------------
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      summary: Accounts with status and storage use (metadata only)
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AdminUser'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: adminCreateUser
      summary: Create a pending account; issue an activation link separately
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUser'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      summary: Disable or enable an account, or set its quota
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUpdateUser'}
      responses:
        '204': {description: Updated}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users/{id}/activation-link:
    post:
      operationId: adminIssueActivationLink
      summary: Issue an activation link (clears the password, signs the user out everywhere)
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '201':
          description: The link, shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivationLink'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/bot-instances:
    get:
      operationId: adminListBotInstances
      summary: Registered bot instances
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AdminBotInstance'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: adminCreateBotInstance
      summary: Register a bot instance
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBotInstance'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBotInstance'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/bot-instances/{id}:
    patch:
      operationId: adminUpdateBotInstance
      summary: Enable or disable an instance
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, disabled]}
      responses:
        '204': {description: Updated}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/bot-instances/{id}/credentials:
    post:
      operationId: adminCreateBotCredential
      summary: Create a credential; the secret is shown once
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items: {type: string, enum: [ingest, deliver]}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotCredential'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/bot-instances/{id}/credentials/{credentialId}:
    delete:
      operationId: adminDisableBotCredential
      summary: Disable a credential
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - name: credentialId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Disabled}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-nka
      description: Access token cookie set by login (HttpOnly, SameSite=Strict).
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token for native clients.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PartId:
      name: partId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Version:
      type: object
      required: [version]
      properties:
        version: {type: string}
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        request_id: {type: string}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 128}
        password: {type: string, maxLength: 1024}
        remember: {type: boolean, default: true}
        client_kind: {type: string, enum: [web, native], default: web}
    RefreshRequest:
      type: object
      properties:
        refresh_token: {type: string, maxLength: 512}
    ActivateRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string, maxLength: 128}
        password: {type: string, maxLength: 1024}
    AuthResult:
      type: object
      required: [user, expires_at]
      properties:
        user: {$ref: '#/components/schemas/Me'}
        expires_at: {type: string, format: date-time, description: When the access token lapses}
        access_token: {type: string, description: Only for native clients}
        refresh_token: {type: string, description: Only for native clients}
    Me:
      type: object
      required: [id, username, display_name, is_admin, timezone, settings]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        is_admin: {type: boolean}
        timezone: {type: string}
        settings: {type: object, additionalProperties: true}
    UpdateMe:
      type: object
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        timezone: {type: string, maxLength: 64}
        settings: {type: object, additionalProperties: true}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, maxLength: 1024}
        new_password: {type: string, maxLength: 1024}
    Session:
      type: object
      required: [id, label, client_kind, created_at, last_used_at, expires_at, current]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        client_kind: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        current: {type: boolean}
    Identity:
      type: object
      required: [id, bot_instance_name, bot_type, external_user_id, reminder_target, linked_at]
      properties:
        id: {type: string, format: uuid}
        bot_instance_name: {type: string}
        bot_type: {type: string}
        external_user_id: {type: string}
        reminder_target: {type: boolean}
        linked_at: {type: string, format: date-time}
    PairingCode:
      type: object
      required: [code, expires_at]
      properties:
        code: {type: string, example: 'K7QM-2XPA'}
        expires_at: {type: string, format: date-time}
    BotInstanceSummary:
      type: object
      required: [id, name, type, online]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string}
        online: {type: boolean}
    NotePart:
      type: object
      required: [id, kind, attach_reason, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [text, attachment, failed_attachment, unsupported]}
        text: {type: string}
        attachment: {$ref: '#/components/schemas/AttachmentRef'}
        failed: {$ref: '#/components/schemas/FailedAttachment'}
        attach_reason: {type: string, enum: [first, reply, thread, media-adjacency, app]}
        created_at: {type: string, format: date-time}
        text_edited_at: {type: string, format: date-time}
        source_bot_type: {type: string, description: Present for parts that came from a chat}
    AttachmentRef:
      type: object
      required: [id, filename, media_type, size]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string}
        media_type: {type: string}
        size: {type: integer, format: int64}
    FailedAttachment:
      type: object
      required: [filename, reason]
      properties:
        filename: {type: string}
        size: {type: integer, format: int64}
        reason: {type: string}
    Note:
      type: object
      required: [id, state, created_at, updated_at, version, parts]
      properties:
        id: {type: string, format: uuid}
        category_id: {type: string, format: uuid, nullable: true}
        state: {type: string, enum: [active, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        previous_location: {$ref: '#/components/schemas/PreviousLocation'}
        version: {type: integer}
        parts:
          type: array
          items: {$ref: '#/components/schemas/NotePart'}
    NotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Note'}
        next_cursor: {type: string}
        total: {type: integer, format: int64}

    Page:
      type: object
      required: [id, name, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        archived: {type: boolean}
        version: {type: integer}
    CreatePage:
      type: object
      required: [name]
      properties:
        id: {type: string, format: uuid, description: Client-generated id; repeating it returns the existing page}
        name: {type: string, minLength: 1, maxLength: 100}
        after_id: {type: string, format: uuid, nullable: true, description: Place after this page; default is the end}
    UpdatePage:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        archived: {type: boolean}
        before_id: {type: string, format: uuid, nullable: true}
        after_id: {type: string, format: uuid, nullable: true}
    Category:
      type: object
      required: [id, page_id, name, version]
      properties:
        id: {type: string, format: uuid}
        page_id: {type: string, format: uuid}
        name: {type: string}
        version: {type: integer}
    CreateCategory:
      type: object
      required: [page_id, name]
      properties:
        id: {type: string, format: uuid}
        page_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        after_id: {type: string, format: uuid, nullable: true}
    UpdateCategory:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        page_id: {type: string, format: uuid, description: Move the category to another page}
        before_id: {type: string, format: uuid, nullable: true}
        after_id: {type: string, format: uuid, nullable: true}
    Deleted:
      type: object
      required: [moved_notes]
      properties:
        moved_notes: {type: integer, description: Notes that returned to the Inbox}
    Board:
      type: object
      required: [page, categories, inbox_total]
      properties:
        page: {$ref: '#/components/schemas/Page'}
        inbox_total: {type: integer, format: int64}
        categories:
          type: array
          items: {$ref: '#/components/schemas/BoardCategory'}
    BoardCategory:
      type: object
      required: [category, notes, total]
      properties:
        category: {$ref: '#/components/schemas/Category'}
        notes:
          type: array
          items: {$ref: '#/components/schemas/Note'}
        total: {type: integer, format: int64}
        next_cursor: {type: string}
    NewPartInput:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [text, attachment]}
        text: {type: string, maxLength: 100000}
        attachment_id: {type: string, format: uuid, description: An attachment uploaded earlier and not yet used}
    CreateNote:
      type: object
      required: [parts]
      properties:
        id: {type: string, format: uuid, description: Client-generated id; repeating it with the same content returns the note}
        category_id: {type: string, format: uuid, nullable: true, description: null puts the note in the Inbox}
        before_id: {type: string, format: uuid, nullable: true}
        after_id: {type: string, format: uuid, nullable: true}
        parts:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/NewPartInput'}
    MoveNote:
      type: object
      required: [category_id]
      properties:
        category_id: {type: string, format: uuid, nullable: true, description: null moves the note to the Inbox}
        before_id: {type: string, format: uuid, nullable: true, description: The note that should come right after it}
        after_id: {type: string, format: uuid, nullable: true, description: The note that should come right before it}
    NewPart:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [text, attachment]}
        text: {type: string, maxLength: 100000}
        attachment_id: {type: string, format: uuid}
    EditPart:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        base_version: {type: integer, description: The note version the edit is based on}
    EditResult:
      type: object
      required: [note, stale]
      properties:
        note: {$ref: '#/components/schemas/Note'}
        stale: {type: boolean, description: True when the note changed since base_version; the overwritten text stays in history}
    NoteHistory:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [part_id, versions]
            properties:
              part_id: {type: string, format: uuid}
              versions:
                type: array
                items: {$ref: '#/components/schemas/PartVersion'}
    PartVersion:
      type: object
      required: [id, text, origin, edited_at, applied]
      properties:
        id: {type: string, format: uuid}
        text: {type: string}
        origin: {type: string, enum: [chat, app]}
        edited_at: {type: string, format: date-time}
        applied: {type: boolean, description: false for a late chat edit that did not overwrite a newer text}
    PreviousLocation:
      type: object
      description: Where a dismissed note came from (Trash view)
      properties:
        category_id: {type: string, format: uuid}
        category_name: {type: string}
        page_id: {type: string, format: uuid}
        page_name: {type: string}

    SearchHit:
      type: object
      required: [note, snippet]
      properties:
        note: {$ref: '#/components/schemas/Note'}
        snippet: {type: string}
        location: {$ref: '#/components/schemas/PreviousLocation'}
    SearchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SearchHit'}
        next_cursor: {type: string}
    Change:
      type: object
      required: [seq, entity_type, entity_id, op]
      properties:
        seq: {type: integer, format: int64}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        op: {type: string, enum: [upsert, delete]}
        version: {type: integer}
    ChangePage:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Change'}
        cursor: {type: string, description: Pass this back to get the next changes}
    AdminUser:
      type: object
      required: [id, username, display_name, status, is_admin, created_at, used_bytes]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [pending, active, disabled, deleting]}
        is_admin: {type: boolean}
        created_at: {type: string, format: date-time}
        used_bytes: {type: integer, format: int64}
        quota_bytes: {type: integer, format: int64, nullable: true}
    CreateUser:
      type: object
      required: [username]
      properties:
        username: {type: string, maxLength: 64}
        display_name: {type: string, maxLength: 100}
        email: {type: string, maxLength: 200}
        timezone: {type: string, maxLength: 64}
    AdminUpdateUser:
      type: object
      properties:
        disabled: {type: boolean}
        quota_bytes: {type: integer, format: int64, minimum: 0, description: Set the storage quota}
        reset_quota: {type: boolean, description: Return to the deployment default quota}
    ActivationLink:
      type: object
      required: [token, path, expires_at]
      properties:
        token: {type: string}
        path: {type: string, description: 'Path to open on the app host, e.g. /activate#TOKEN'}
        expires_at: {type: string, format: date-time}
    AdminBotInstance:
      type: object
      required: [id, type, name, identity_domain, status, created_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        name: {type: string}
        identity_domain: {type: string}
        status: {type: string, enum: [active, disabled]}
        last_seen_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        credentials:
          type: array
          items: {$ref: '#/components/schemas/BotCredentialInfo'}
    CreateBotInstance:
      type: object
      required: [type, name]
      properties:
        type: {type: string, maxLength: 32}
        name: {type: string, maxLength: 64}
        identity_domain: {type: string, maxLength: 253}
    BotCredentialInfo:
      type: object
      required: [id, client_id, scopes, created_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string}
        scopes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        disabled_at: {type: string, format: date-time}
    BotCredential:
      type: object
      required: [id, client_id, bearer]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string}
        bearer: {type: string, description: The value the bot sends in Authorization; shown once}
