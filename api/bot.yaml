openapi: 3.0.3
info:
  title: Notekeeper bot API
  version: 1.0.0
  description: |
    Cluster-internal API used by chat bots (bot key authentication). See docs/design/02-api.md
    section 2 and docs/design/04-ingestion.md. Core owns all wording: responses carry the text
    a bot should send, so bots contain none of their own (BOT-8).
servers:
  - url: /
paths:
  /bot/v1/version:
    get:
      operationId: getBotVersion
      summary: Build information
      security: []
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
  /bot/v1/events:
    post:
      operationId: postEvent
      summary: A normalised chat event (created, edited or deleted message)
      security:
        - botAuth: [ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
      responses:
        '200':
          description: Outcome, replayed unchanged for a repeated event id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventResult'}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/commands:
    post:
      operationId: postCommand
      summary: A chat command (link, unlink, help, ...)
      security:
        - botAuth: [ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Command'}
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResult'}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/identities/{external_user_id}:
    get:
      operationId: getIdentity
      summary: Whether a chat identity is linked (nothing about the user)
      security:
        - botAuth: [ingest]
      parameters:
        - name: external_user_id
          in: path
          required: true
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: Link status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityStatus'}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/heartbeat:
    post:
      operationId: postHeartbeat
      summary: Liveness signal for the admin's bot status
      description: |
        Optionally carries the address users write to in their chat app (for Matrix the bot's own user id).
        Core shows it in the pairing instructions. It is stored only when it belongs to the instance's
        identity domain; anything else is ignored.
      security:
        - botAuth: [ingest]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                address: {type: string, maxLength: 255}
      responses:
        '204': {description: Recorded}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/uploads/{id}:
    put:
      operationId: putUpload
      summary: Stream an attachment for a linked chat identity (already decrypted by the bot)
      description: |
        Same storage path and quota as the user upload. The body is the raw file with
        `Content-Type: application/octet-stream` and a required `Content-Length`. The attachment
        stays unlinked until an event references it by `upload_id`; unused ones are removed after an hour.
      security:
        - botAuth: [ingest]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-External-User
          in: header
          required: true
          schema: {type: string, maxLength: 512}
        - name: X-Filename
          in: header
          required: true
          schema: {type: string, maxLength: 1024}
        - name: X-Media-Type
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/outbox:
    get:
      operationId: claimOutbox
      summary: Long-poll the outbox for items addressed to this bot instance
      description: |
        Claims queued items with a 60-second lease. Waits up to `wait` seconds when nothing is
        available. An item that is not acknowledged before its lease expires is offered again;
        an expired lease does not count as a delivery attempt.
      security:
        - botAuth: [deliver]
      parameters:
        - name: wait
          in: query
          schema: {type: integer, minimum: 0, maximum: 25, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Claimed items (possibly none)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OutboxItem'}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/outbox/{id}/attachments/{attachmentId}:
    get:
      operationId: getOutboxAttachment
      summary: Download a file that a claimed reminder lists, to send it into the chat
      description: |
        Only files listed in the payload of an item this bot instance has claimed, and only while
        the claim lasts. A bot key never reads anything else of a user's files (BOT-15, SEC-BOT-3).
      security:
        - botAuth: [deliver]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: attachmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/outbox/{id}/result:
    post:
      operationId: postOutboxResult
      summary: Report what happened to a claimed outbox item
      security:
        - botAuth: [deliver]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutboxResult'}
      responses:
        '204': {description: Recorded}
        default: {$ref: '#/components/responses/Problem'}
  /bot/v1/conversations/{id}/cursor:
    get:
      operationId: getConversationCursor
      summary: The platform time of the newest message Core holds for a conversation
      description: Lets a bot that lost its own position resume after the right message instead of replaying everything.
      security:
        - botAuth: [ingest]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: The cursor (absent when Core holds nothing for the conversation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_message_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    botAuth:
      type: http
      scheme: bearer
      description: 'Bot key: nkb.<client id>.<secret>. Scopes: ingest, deliver.'
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Version:
      type: object
      required: [version]
      properties:
        version: {type: string}
    Problem:
      type: object
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        request_id: {type: string}
    Event:
      type: object
      required: [event_id, kind, sender, conversation, message_id, timestamp]
      properties:
        event_id: {type: string, maxLength: 512, description: Unique per platform event; the dedupe key}
        kind: {type: string, enum: [message_created, message_edited, message_deleted]}
        sender: {type: string, maxLength: 512, description: Verified by the bot from platform metadata}
        conversation: {type: string, maxLength: 512}
        message_id: {type: string, maxLength: 512, description: For edits and deletes the ORIGINAL message id}
        timestamp: {type: string, format: date-time, description: Platform event time}
        relates_to:
          type: object
          properties:
            reply_to: {type: string, maxLength: 512}
            thread: {type: string, maxLength: 512}
        parts:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/EventPart'}
    EventPart:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [text, attachment, attachment_failed, unsupported]}
        text: {type: string, maxLength: 400000}
        upload_id: {type: string, format: uuid}
        filename: {type: string, maxLength: 512}
        media_type: {type: string, maxLength: 256}
        size: {type: integer, format: int64}
        reason: {type: string, maxLength: 64}
        description: {type: string, maxLength: 512}

    Upload:
      type: object
      required: [id, filename, media_type, size]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string}
        media_type: {type: string}
        size: {type: integer, format: int64}
    OutboxItem:
      type: object
      required: [id, kind, external_user_id, conversation_id, payload, attempts]
      properties:
        id: {type: string, format: uuid, description: Also the idempotency key for the platform send (BOT-13)}
        kind: {type: string, enum: [reminder, notice, lifecycle]}
        external_user_id: {type: string}
        conversation_id: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: 'notice/reminder: {text, ...}; lifecycle: {reason: unlinked | user_deleted}'
        attempts: {type: integer}
        due_at: {type: string, format: date-time}
    OutboxResult:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [delivered, failed_transient, failed_permanent]}
        reason: {type: string, maxLength: 200}
        message_ids:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 512}
    Feedback:
      type: object
      properties:
        react: {type: string, description: 'Reaction to add to the source message, e.g. "ok"'}
        reply_text: {type: string, description: Text to send back to the user}
    EventResult:
      type: object
      required: [result, feedback]
      properties:
        result: {type: string, enum: [created, appended, updated, removed, ignored, rejected]}
        note_id: {type: string, format: uuid}
        code: {type: string}
        feedback: {$ref: '#/components/schemas/Feedback'}
    Command:
      type: object
      required: [command, sender, conversation]
      properties:
        command: {type: string, maxLength: 32}
        args: {type: string, maxLength: 2000}
        sender: {type: string, maxLength: 512}
        conversation: {type: string, maxLength: 512}
        message_id: {type: string, maxLength: 512}
        reply_to: {type: string, maxLength: 512}
        timestamp: {type: string, format: date-time}
    CommandResult:
      type: object
      required: [ok, feedback]
      properties:
        ok: {type: boolean}
        feedback: {$ref: '#/components/schemas/Feedback'}
    IdentityStatus:
      type: object
      required: [linked]
      properties:
        linked: {type: boolean}
        linked_at: {type: string, format: date-time}
        conversation: {type: string}
