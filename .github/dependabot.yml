# Keeps the pinned versions current (SEC-OPS-6). Updates arrive as pull requests that run the full CI. Within
# an ecosystem the minor and patch updates come together in one pull request (one CI run for many bumps); a
# major update is a pull request of its own, because it needs a look.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: gomod
    directories: [/core, /bots/sdk, /bots/matrix]
    schedule: {interval: weekly}
    groups:
      go-modules: {patterns: ['*'], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      npm-packages: {patterns: ['*'], update-types: [minor, patch]}
    ignore:
      # openapi-typescript accepts only TypeScript 5 and typescript-eslint only versions below 6.1, so the web
      # app stays on 5.9 until both move (docs/tech-stack.md section 11). The e2e package has no such tie.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
    groups:
      npm-packages: {patterns: ['*'], update-types: [minor, patch]}
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly}
    ignore:
      # Odd Node versions are short-lived and never become LTS; the images follow the even ones.
      - dependency-name: node
        versions: ['25.*', '27.*', '29.*']
