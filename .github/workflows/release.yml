name: Release

# Publishes the three container images to the GitHub container registry when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The whole CI workflow (unit, integration, browser and image tests, vulnerability scans) must pass first.
# Images: ghcr.io/<owner>/notekeeper-core, notekeeper-web and notekeeper-matrix-bot, tagged 1.2.3, 1.2 and
# (for a version without a pre-release suffix) latest, built for linux/amd64.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # push to ghcr.io with the workflow's own token
      id-token: write        # keyless signing of the image digest
      attestations: write    # build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: core, dockerfile: Dockerfile.core}
          - {image: web, dockerfile: Dockerfile.web}
          - {image: matrix-bot, dockerfile: Dockerfile.bot}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lower case; the owner of the repository may not be.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/notekeeper-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with generated notes and the image list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "## Container images"
            echo
            for image in core web matrix-bot; do
              ref="ghcr.io/${owner}/notekeeper-${image}"
              digest="$(docker buildx imagetools inspect "${ref}:${version}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              echo "- \`${ref}:${version}\`${digest:+ (digest \`${digest}\`)}"
            done
            echo
            case "$version" in
              *-*) echo "This is a pre-release: the images carry only the exact version tag, not \`latest\` or the \`major.minor\` tag." ;;
              *)   echo "Also tagged \`${version%.*}\` (this minor version) and \`latest\`." ;;
            esac
            echo "All images are linux/amd64. Pin the version (or the digest) in your deployment; see docs/operations.md."
            echo
          } > release-notes.md
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file release-notes.md $flags
