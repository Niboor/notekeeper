name: CI

# Every job below runs on every pull request, on every merge to master (main), and as the gate of a
# release (release.yml calls this workflow before it publishes anything).
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; runs on master are never cancelled, so every
# merge gets a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            core/go.sum
            bots/matrix/go.sum
            bots/sdk/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Matrix bot needs a C compiler (present) and libolm with headers (make check-libolm).
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev

      - name: Install pinned tools
        run: make tools

      - name: Install web dependencies
        run: make web-install

      # Lint, unit tests, integration tests (Docker: PostgreSQL 16 and latest, Synapse),
      # generation drift, traceability, secret scan and vulnerability scans.
      - name: make check
        run: make check

  e2e:
    name: make test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            core/go.sum
            bots/matrix/go.sum
            bots/sdk/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        run: make web-install

      # Browsers and their system libraries; the tests then drive the built web app and a real Core.
      - name: Install Playwright browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Browser end-to-end tests (Chromium)
        run: e2e/run.sh

  # Firefox and WebKit run the @cross tests (WEB-N6). Firefox passes and blocks; WebKit is still being proven.
  e2e-cross-browser:
    name: browsers other than Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            core/go.sum
            bots/matrix/go.sum
            bots/sdk/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install web dependencies
        run: make web-install
      - name: Install Playwright browsers
        run: cd e2e && npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests on Firefox
        run: E2E_BROWSERS=all e2e/run.sh --project=firefox
      # WebKit does not accept the Secure cookies of an http origin, so it runs against https with a throwaway
      # certificate. Not proven yet: it reports without failing the job.
      - name: Browser tests on WebKit (https)
        continue-on-error: true
        run: E2E_BROWSERS=all E2E_TLS=1 e2e/run.sh --project=webkit

  images:
    name: scan image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [core, web, matrix-bot]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile.${{ matrix.image == 'matrix-bot' && 'bot' || matrix.image }} -t notekeeper/${{ matrix.image }}:dev .
      # Known vulnerabilities in the built image (SEC-OPS-6); the source dependencies are scanned by make check.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notekeeper/${{ matrix.image }}:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e-stack:
    name: make test-e2e-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      # Builds the three images, starts them behind nginx and runs the browser tests through it.
      - name: Browser tests against the built images
        run: e2e/run-stack.sh
