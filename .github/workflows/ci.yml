name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            core/go.sum
            bots/matrix/go.sum
            bots/sdk/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Matrix bot needs a C compiler (present) and libolm with headers (make check-libolm).
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev

      - name: Install pinned tools
        run: make tools

      - name: Install web dependencies
        run: make web-install

      # Lint, unit tests, integration tests (Docker: PostgreSQL 16 and latest, Synapse),
      # generation drift, traceability, secret scan and vulnerability scans.
      - name: make check
        run: make check
