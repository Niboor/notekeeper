name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            core/go.sum
            bots/matrix/go.sum
            bots/sdk/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Matrix bot needs a C compiler (present) and libolm with headers (make check-libolm).
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev

      - name: Install pinned tools
        run: make tools

      - name: Install web dependencies
        run: make web-install

      # Lint, unit tests, integration tests (Docker: PostgreSQL 16 and latest, Synapse),
      # generation drift, traceability, secret scan and vulnerability scans.
      - name: make check
        run: make check

  e2e:
    name: make test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            core/go.sum
            bots/matrix/go.sum
            bots/sdk/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        run: make web-install

      # Browsers and their system libraries; the tests then drive the built web app and a real Core.
      - name: Install Playwright browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Install the other browsers (WEB-N6)
        run: cd e2e && npx playwright install --with-deps firefox webkit

      - name: Browser end-to-end tests (Chromium, and Firefox and WebKit on the @cross tests)
        run: E2E_BROWSERS=all e2e/run.sh

  e2e-stack:
    name: make test-e2e-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      # Builds the three images, starts them behind nginx and runs the browser tests through it.
      - name: Browser tests against the built images
        run: e2e/run-stack.sh
