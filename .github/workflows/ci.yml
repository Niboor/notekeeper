name: CI

# Every job below runs on every pull request, on every merge to master (main), and as the gate of a
# release (release.yml calls this workflow, unless the tagged commit has already passed it on master).
#
# `make check` is what a developer runs; here its parts run side by side as separate jobs, calling the
# same Makefile targets, and "CI passed" at the end is the one status that says everything is green.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Every commit on master has a group of its
# own: runs on master are never cancelled and do not wait for each other, so each merge gets a full,
# prompt result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- the parts of `make check` ------------------------------------------------------------------

  generate:
    name: generated code and docs are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tools: true, web: true}
      - run: make generate-check docs-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tools: true, libolm: true, web: true}
      - run: make lint

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {libolm: true, web: true}
      - run: make test

  integration-core:
    name: core integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {node: false}
      - run: make test-integration-core

  integration-bot:
    name: bot integration tests (Synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {node: false, libolm: true}
      - run: make test-integration-bot

  security:
    name: secret and vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {node: false, tools: true, libolm: true}
      - run: make secrets vuln

  # ---- browsers ------------------------------------------------------------------------------------

  e2e:
    name: make test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {web: true, playwright: chromium}
      # The tests drive the built web app and a real Core.
      - name: Browser end-to-end tests (Chromium)
        run: e2e/run.sh

  # Firefox and WebKit run the @cross tests (WEB-N6), each in its own job; both block. WebKit does not accept the
  # Secure cookies of an http origin, so it runs against https with a throwaway certificate.
  e2e-cross-browser:
    name: ${{ matrix.browser }} (@cross tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: firefox, tls: ''}
          - {browser: webkit, tls: '1'}
    steps:
      - uses: actions/checkout@v7
      # The tests log in through Chromium once, whatever browser they then run in.
      - uses: ./.github/actions/setup
        with:
          web: true
          playwright: chromium ${{ matrix.browser }}
      - name: Browser tests on ${{ matrix.browser }}
        env:
          E2E_BROWSERS: all
          E2E_TLS: ${{ matrix.tls }}
        run: e2e/run.sh --project=${{ matrix.browser }}

  # ---- the images -----------------------------------------------------------------------------------

  # The images are built with the layer cache, which the stack tests below and the release share (one cache per
  # image), so a change to the sources rebuilds only what depends on it.
  images:
    name: scan image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [core, web, matrix-bot]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image == 'matrix-bot' && 'bot' || matrix.image }}
          load: true
          tags: notekeeper/${{ matrix.image }}:dev
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Known vulnerabilities in the built image (SEC-OPS-6); the source dependencies are scanned by the security job.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notekeeper/${{ matrix.image }}:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e-stack:
    name: make test-e2e-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: false
          playwright: chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build the Core image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          load: true
          tags: notekeeper/core:dev
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          load: true
          tags: notekeeper/web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # Starts the images behind nginx and runs the browser tests through it.
      - name: Browser tests against the built images
        env:
          E2E_SKIP_BUILD: '1' # built above, with the cache
        run: e2e/run-stack.sh

  # ---- the verdict -----------------------------------------------------------------------------------

  # One status for "everything passed", whatever jobs are added or split above: use this one as the required
  # check when the branch is protected.
  passed:
    name: CI passed
    if: always()
    needs: [generate, lint, unit, integration-core, integration-bot, security, e2e, e2e-cross-browser, images, e2e-stack]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "not everything passed"; exit 1; }; done
