# Development stack. More services (Synapse, Core, web, Matrix bot) are added by later
# milestones for `make test-e2e`. This is an example, not a production deployment (NFR-D6).
name: notekeeper

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notekeeper
      POSTGRES_USER: nk
      POSTGRES_PASSWORD: nk-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nk -d notekeeper"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Matrix homeserver for the bot's integration and end-to-end tests. Development only.
  synapse:
    profiles: ["matrix"]
    image: matrixdotorg/synapse:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        python -m synapse.app.homeserver --config-path /data/homeserver.yaml --generate-keys &&
        exec python -m synapse.app.homeserver --config-path /data/homeserver.yaml
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/log.config:/data/log.config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  dbdata:
