# Example alerts (SEC-AUD-3, NFR-O2). Needs the Prometheus Operator; the expressions work in any
# Prometheus. The thresholds are starting points for a small deployment.
#
# The two "is it running" alerts (NotekeeperCoreDown, NotekeeperBotDown) match the scrape job by name, and
# the job label comes from your scrape setup (with a ServiceMonitor it is the name of the Service, with
# annotation-based discovery often a generic name). The patterns match a job called core / matrix-bot, or one that
# has it as a whole word after or before a - or / (core-metrics, notekeeper/core, notekeeper-matrix-bot). They are
# anchored on purpose: an unanchored .*core.* also matches coredns, and absent() would then never fire. If your jobs
# are named differently, adjust the two patterns (or add a namespace label matcher).
#
# Values that contain commas or colons are quoted: inside an unquoted YAML flow mapping a comma starts a new entry.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notekeeper
spec:
  groups:
    - name: notekeeper-security
      rules:
        - alert: NotekeeperFailedLoginSpike
          expr: sum(increase(nk_auth_events_total{event=~"failed|throttled"}[10m])) > 30
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Many failed or throttled sign-ins, which may be someone guessing passwords"}
        - alert: NotekeeperBotRequestsRejected
          expr: sum(increase(nk_bot_requests_rejected_total[10m])) > 20
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Requests with a bad or unauthorised bot key, which may be a leaked or guessed credential"}
        - alert: NotekeeperShareLinkProbing
          expr: sum(increase(nk_share_requests_total{result="not_found"}[10m])) > 100
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Many share requests for links that do not exist, which may be someone probing for tokens"}
        - alert: NotekeeperRateLimitHits
          expr: sum(increase(nk_rate_limited_total[10m])) > 200
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Requests are being refused by rate limits at a high rate"}
        - alert: NotekeeperRefreshTokenReuse
          expr: sum(increase(nk_auth_events_total{event="refresh_reuse"}[1h])) > 5
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Sessions were ended because an old refresh token was used again, which is either a stolen token or a client that does not renew its session correctly"}
        - alert: NotekeeperStreamsRefused
          expr: sum(increase(nk_realtime_streams_refused_total[15m])) > 20
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Live-update streams are refused because a user has too many open, which points at a client that never closes its old ones"}
    - name: notekeeper-health
      rules:
        - alert: NotekeeperCoreDown
          expr: absent(up{job=~"(.*[-/])?core([-/].*)?"} == 1)
          for: 3m
          labels: {severity: critical}
          annotations: {summary: "No Core replica is being scraped as up"}
        - alert: NotekeeperBotDown
          expr: absent(up{job=~"(.*[-/])?matrix-bot([-/].*)?"} == 1)
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "The Matrix bot is not running, so chat messages are not reaching Notekeeper"}
        - alert: NotekeeperBotStalled
          expr: time() - max(nk_bot_last_sync_timestamp_seconds) > 600
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "The Matrix bot is running but has not completed a sync for ten minutes, so chat messages are not reaching Notekeeper"}
        - alert: NotekeeperOutboxBacklog
          expr: sum(nk_outbox_items{state=~"queued|claimed"}) > 50
          for: 15m
          labels: {severity: warning}
          annotations: {summary: "Messages for chats (reminders, notices) are waiting for a bot to send them"}
        - alert: NotekeeperReminderLag
          expr: histogram_quantile(0.95, sum(rate(nk_reminder_lag_seconds_bucket[15m])) by (le)) > 60
          for: 15m
          labels: {severity: warning}
          annotations: {summary: "Reminders fire more than a minute after they are due (target CORE-R5)"}
        - alert: NotekeeperJobFailures
          expr: sum by (task) (increase(nk_job_failures_total[30m])) > 3
          labels: {severity: warning}
          annotations: {summary: "Background jobs are failing"}
        - alert: NotekeeperServerErrors
          expr: sum(rate(nk_http_requests_total{status="5xx"}[5m])) / sum(rate(nk_http_requests_total[5m])) > 0.05
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "More than one request in twenty fails with a server error"}
        - alert: NotekeeperReminderJobStalled
          expr: time() - max(nk_job_last_success_timestamp_seconds{task="fire_due_reminders"}) > 300
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "The job that fires reminders has not completed successfully for five minutes, so reminders are not going out (a stopped job counts no failures, so this is the alert that sees it)"}
        - alert: NotekeeperOutboxOldItem
          expr: max(nk_outbox_oldest_wait_seconds) > 300
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "A reminder or notice has been waiting more than five minutes for a bot to send it"}
        - alert: NotekeeperBotCannotReachCore
          expr: sum(increase(nk_bot_outbox_claim_failures_total[10m])) > 5 or sum(increase(nk_bot_core_retries_total[10m])) > 20
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "The bot keeps failing to call Core, so chat messages and reminders are delayed"}
        - alert: NotekeeperDatabasePoolWaits
          expr: sum(rate(nk_db_pool_acquire_wait_seconds_total[5m])) / clamp_min(sum(rate(nk_db_pool_acquires_total[5m])), 0.001) > 0.1
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Requests wait more than a tenth of a second on average for a database connection"}
        - alert: NotekeeperDatabasePoolSaturated
          expr: max(nk_db_pool_connections - nk_db_pool_idle_connections) >= max(nk_db_pool_max_connections)
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Every connection of the database pool is in use, so requests wait for one"}
