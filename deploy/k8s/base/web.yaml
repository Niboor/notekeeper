apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app.kubernetes.io/name: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101   # the memory volumes for nginx's rendered config and cache must be writable by uid 101
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: web}}
      containers:
        - name: web
          image: notekeeper/web:latest
          envFrom:
            - configMapRef: {name: notekeeper-config}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: conf, mountPath: /etc/nginx/conf.d}   # the rendered server blocks
      volumes:
        - {name: tmp, emptyDir: {medium: Memory}}
        - {name: cache, emptyDir: {medium: Memory}}
        - {name: conf, emptyDir: {medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app.kubernetes.io/name: web}
  ports: [{name: http, port: 8080, targetPort: http}]
